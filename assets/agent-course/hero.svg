<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title"><title id="title">AI Agent 從工作資料到三類成果的流程圖</title><rect width="800" height="480" rx="24" fill="#f2efe8"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="35" y="47" fill="#0b1d2a" font-size="27" font-weight="700">從一項工作，到一個 AI 助手</text><text x="35" y="78" fill="#526570" font-size="16" font-weight="500">課堂成果示意 · 使用模擬資料</text><rect x="30" y="110" width="300" height="110" rx="16" fill="#fff" stroke="#d8dedf"/><text x="50" y="145" fill="#3348a1" font-size="18" font-weight="700">你的工作資料</text><text x="50" y="182" fill="#0b1d2a" font-size="22" font-weight="500">產品文件 / CSV / SOP</text><text x="347" y="180" fill="#3348a1" font-size="35" font-weight="500">→</text><rect x="397" y="110" width="373" height="110" rx="16" fill="#0b1d2a" stroke="#0b1d2a"/><text x="420" y="145" fill="#ffb298" font-size="18" font-weight="700">Codex · 任務執行</text><text x="420" y="181" fill="#fff" font-size="23" font-weight="500">規劃 → 製作 → 修正</text><text x="570" y="255" fill="#3348a1" font-size="32" font-weight="500">↓</text><rect x="30" y="280" width="740" height="155" rx="16" fill="#fff" stroke="#d8dedf"/><text x="53" y="319" fill="#3348a1" font-size="20" font-weight="700">交付工作成果</text><text x="53" y="360" fill="#0b1d2a" font-size="25" font-weight="700">研究與提案</text><text x="53" y="394" fill="#526570" font-size="18" font-weight="500">業務行銷</text><text x="293" y="360" fill="#0b1d2a" font-size="25" font-weight="700">報表與檢查</text><text x="293" y="394" fill="#526570" font-size="18" font-weight="500">行政營運</text><text x="533" y="360" fill="#0b1d2a" font-size="25" font-weight="700">教材與測驗</text><text x="533" y="394" fill="#526570" font-size="18" font-weight="500">HR / 培訓</text><text x="35" y="465" fill="#526570" font-size="17" font-weight="500">每一步保留人工核對與確認</text></g></svg>