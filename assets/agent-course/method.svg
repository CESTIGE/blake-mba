<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="title"><title id="title">四步驟教學流程：選工作、交任務、做成果、留方法</title><rect width="800" height="390" rx="24" fill="#f2efe8"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="30" y="47" fill="#0b1d2a" font-size="27" font-weight="700">從工作題目，到同事能接手</text><rect x="28" y="96" width="174" height="215" rx="16" fill="#fff" stroke="#d8dedf"/><circle cx="64" cy="137" r="20" fill="#3348a1"/><text x="58" y="145" fill="#fff" font-size="21" font-weight="700">1</text><text x="46" y="197" fill="#0b1d2a" font-size="26" font-weight="700">選工作</text><text x="46" y="240" fill="#526570" font-size="18" font-weight="500">定義問題</text><text x="46" y="273" fill="#526570" font-size="18" font-weight="500">與完成標準</text><rect x="222" y="96" width="174" height="215" rx="16" fill="#fff" stroke="#d8dedf"/><circle cx="258" cy="137" r="20" fill="#3348a1"/><text x="252" y="145" fill="#fff" font-size="21" font-weight="700">2</text><text x="240" y="197" fill="#0b1d2a" font-size="26" font-weight="700">交任務</text><text x="240" y="240" fill="#526570" font-size="18" font-weight="500">備好資料</text><text x="240" y="273" fill="#526570" font-size="18" font-weight="500">拆出執行步驟</text><rect x="416" y="96" width="174" height="215" rx="16" fill="#fff" stroke="#d8dedf"/><circle cx="452" cy="137" r="20" fill="#3348a1"/><text x="446" y="145" fill="#fff" font-size="21" font-weight="700">3</text><text x="434" y="197" fill="#0b1d2a" font-size="26" font-weight="700">做成果</text><text x="434" y="240" fill="#526570" font-size="18" font-weight="500">製作與測試</text><text x="434" y="273" fill="#526570" font-size="18" font-weight="500">核對來源數字</text><rect x="610" y="96" width="174" height="215" rx="16" fill="#fff" stroke="#d8dedf"/><circle cx="646" cy="137" r="20" fill="#3348a1"/><text x="640" y="145" fill="#fff" font-size="21" font-weight="700">4</text><text x="628" y="197" fill="#0b1d2a" font-size="26" font-weight="700">留方法</text><text x="628" y="240" fill="#526570" font-size="18" font-weight="500">整理範本</text><text x="628" y="273" fill="#526570" font-size="18" font-weight="500">讓同事重跑</text><text x="35" y="356" fill="#3348a1" font-size="20" font-weight="700">人員確認重要操作，成果經查核後交付。</text></g></svg>