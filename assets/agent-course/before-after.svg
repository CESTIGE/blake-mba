<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title"><title id="title">工作前後對照：從手動整理到有範本與查核的流程</title><rect width="800" height="450" rx="24" fill="#f2efe8"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="35" y="48" fill="#0b1d2a" font-size="27" font-weight="700">把重複工作，變成能重跑的流程</text><rect x="30" y="85" width="350" height="330" rx="16" fill="#fff" stroke="#d8dedf"/><text x="53" y="126" fill="#3348a1" font-size="23" font-weight="700">原本的做法</text><rect x="420" y="85" width="350" height="330" rx="16" fill="#e8edfb" stroke="#d8dedf"/><text x="443" y="126" fill="#3348a1" font-size="23" font-weight="700">課堂練習後</text><text x="53" y="182" fill="#0b1d2a" font-size="21" font-weight="500">逐份找資料</text><text x="443" y="182" fill="#0b1d2a" font-size="21" font-weight="500">整理輸入與來源</text><text x="53" y="268" fill="#0b1d2a" font-size="21" font-weight="500">反覆貼上、重新交代</text><text x="443" y="268" fill="#0b1d2a" font-size="21" font-weight="500">用任務範本分步執行</text><text x="53" y="354" fill="#0b1d2a" font-size="21" font-weight="500">換人接手，又從頭摸索</text><text x="443" y="354" fill="#0b1d2a" font-size="21" font-weight="500">核對成果，照說明重跑</text><text x="382" y="260" fill="#3348a1" font-size="28" font-weight="500">→</text></g></svg>