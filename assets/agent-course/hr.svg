<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title"><title id="title">HR 成果示意：SOP 學習單元、情境練習及檢核表</title><rect width="800" height="480" rx="24" fill="#f2efe8"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="30" y="44" fill="#0b1d2a" font-size="26" font-weight="700">新人 SOP 學習助手</text><text x="30" y="73" fill="#526570" font-size="16" font-weight="500">模擬資料｜新人報到流程</text><rect x="25" y="98" width="750" height="350" rx="16" fill="#fff" stroke="#d8dedf"/><rect x="47" y="120" width="220" height="302" rx="16" fill="#e8f2ed" stroke="#d8dedf"/><text x="66" y="158" fill="#236457" font-size="21" font-weight="700">學習單元</text><text x="66" y="208" fill="#0b1d2a" font-size="20" font-weight="500">01  報到準備</text><text x="66" y="259" fill="#0b1d2a" font-size="20" font-weight="500">02  作業步驟</text><text x="66" y="310" fill="#0b1d2a" font-size="20" font-weight="500">03  情境練習</text><text x="66" y="361" fill="#0b1d2a" font-size="20" font-weight="500">04  自我檢核</text><text x="297" y="159" fill="#0b1d2a" font-size="23" font-weight="700">今天需要準備什麼？</text><text x="297" y="216" fill="#0b1d2a" font-size="21" font-weight="500">□  確認文件版本與來源</text><text x="297" y="273" fill="#0b1d2a" font-size="21" font-weight="500">□  按步驟完成範例操作</text><text x="297" y="330" fill="#0b1d2a" font-size="21" font-weight="500">□  遇到例外，交由窗口確認</text><text x="297" y="406" fill="#526570" font-size="18" font-weight="500">附：FAQ、測驗與操作說明</text></g></svg>