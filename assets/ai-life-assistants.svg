<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">AI assistants helping people with everyday life tasks</title>
  <desc id="desc">A clean illustration of ChatGPT, Claude, Gemini and AI cards helping people with schedules, learning, budget, health, meals and career planning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.55" stop-color="#eef8fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2476ff"/>
      <stop offset="1" stop-color="#11c3d6"/>
